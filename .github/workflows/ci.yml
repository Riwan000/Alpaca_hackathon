# Task P1-OPS-3 — CI on every PR.
#
#   backend       : pytest -q (smoke deselected) + coverage gate
#   frontend      : npm test + npm run build + tsc --noEmit  (skips until scaffolded)
#   db-fresh      : migrate then seed against a service Postgres
#   docs-commands : execute the README's runnable command blocks (P1-OPS-5)
#
# Smoke tests (`-m smoke`) hit live Alpaca / LLM endpoints and never run here.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PG_DSN: postgresql://postgres:postgres@localhost:5432/appdb

jobs:
  backend:
    name: backend (pytest + coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/appdb
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/appdb
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Preflight (.env keys)
        run: python scripts/check_env.py --env-file .env.example || true
      - name: Run tests (smoke excluded) + coverage gate
        run: >-
          pytest -q -m "not smoke"
          --cov=backend --cov-report=xml --cov-report=term-missing
          --cov-fail-under=0
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: frontend (vitest + build + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect scaffold
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm ci
      - name: Unit / component tests
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm test
      - name: Build + type-check
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: |
          npm run build
          npx tsc --noEmit
      - name: Not scaffolded yet
        if: steps.detect.outputs.present != 'true'
        run: echo "frontend/ has no package.json yet (P1-FE-*, owned by Antigravity) — nothing to test."

  db-fresh:
    name: db-fresh (migrate + seed on a clean Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ALEMBIC_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/appdb
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/appdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: migrate
        run: python -m alembic -c backend/alembic.ini upgrade head
      - name: seed
        run: python -m backend.seed
      - name: verify demo row counts
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          from backend.db import migration_url

          engine = create_engine(migration_url())
          with engine.connect() as conn:
              snapshots = conn.execute(text("select count(*) from portfolio_snapshots")).scalar()
              positions = conn.execute(text("select count(*) from positions")).scalar()
          print(f"portfolio_snapshots={snapshots} positions={positions}")
          assert snapshots == 1, f"expected 1 snapshot, got {snapshots}"
          assert positions == 4, f"expected 4 positions, got {positions}"
          PY

  docs-commands:
    name: docs-commands (README runnable blocks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Execute README ```bash ci``` blocks
        run: python scripts/run_doc_commands.py README.md
