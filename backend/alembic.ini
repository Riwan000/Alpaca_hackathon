# Alembic configuration — task P1-DB-2.
#
# The database URL is NOT set here; ``db/migrations/env.py`` resolves it from
# ``backend.db.migration_url()`` (the Neon direct/unpooled DSN, or an
# ``ALEMBIC_DATABASE_URL`` override). Run from the repo root:
#
#   python -m alembic -c backend/alembic.ini upgrade head      (== make migrate)
#   python -m alembic -c backend/alembic.ini downgrade base

[alembic]
# Migration scripts, relative to this file (%(here)s == the backend/ dir).
script_location = %(here)s/db/migrations

# Prepend the repo root to sys.path so ``import backend.db`` resolves in env.py.
prepend_sys_path = %(here)s/..

# os.pathsep-based splitting for the path lists above.
path_separator = os

# Dated, slugged filenames for generated revisions.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Logging — consumed by env.py via logging.config.fileConfig.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
