[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-hedge-agent"
version = "0.1.0"
description = "Autonomous Adaptive Portfolio Hedge Agent — backend"
requires-python = ">=3.11"

# Full backend dependency manifest — task P1-BE-2.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "python-dotenv>=1.0",
    "httpx>=0.28,<1",
    "alpaca-py>=0.33,<1",
    "langgraph>=1.0,<2",
    "openai>=1.40",
    "PyYAML>=6",  # backend/agents/prompts loads templates.yaml at import time
    "asyncpg>=0.30,<1",
    "alembic>=1.16,<2",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-cov>=5",
    "pytest-asyncio>=1.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.agents.prompts" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Smoke tests hit live providers with real credentials — opt in with `-m smoke`.
addopts = "-m 'not smoke'"
markers = [
    "smoke: hits a real external provider with live credentials (deselected by default)",
    "unit: fast, isolated, no network or DB",
    "integration: touches a real DB or external service",
]

[tool.coverage.run]
source = ["backend"]
branch = true
